name: Generar piloto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx remotion browser ensure
      - run: npm run render -- --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: imperio-de-papel-piloto
          path: out/wework-piloto.mp4
          retention-days: 30
